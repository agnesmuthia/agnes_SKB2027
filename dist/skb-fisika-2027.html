<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKB Fisika 2027</title>
<meta name="description" content="Latihan harian dan simulasi SKB kompetensi teknis guru fisika: soal pedagogik dan profesional HOTS dengan pembahasan dan latihan rumus.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: aplikasi satu kolom (maks 1080px) dengan bilah atas; ruang ujian meniru CAT: soal di kiri, panel nomor di kanan. */
:root {
  --ink: #13213c;
  --ink-2: #44506a;
  --ink-3: #6b7790;
  --paper: #f2f5f9;
  --surface: #ffffff;
  --surface-2: #e8edf4;
  --line: #d3dbe6;
  --accent: #2b55d0;
  --accent-ink: #ffffff;
  --accent-soft: #e3eafc;
  --ok: #0d7f69;
  --ok-soft: #dcf2ec;
  --bad: #c0362c;
  --bad-soft: #fbe4e1;
  --flag: #b47d00;
  --flag-soft: #fdf0cc;
  --grid: rgba(43, 85, 208, 0.06);
  --shadow: 0 1px 2px rgba(19, 33, 60, 0.06), 0 6px 20px rgba(19, 33, 60, 0.06);
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e4eaf4; --ink-2: #b4bfd2; --ink-3: #8794ab; --paper: #0d1420; --surface: #151f30; --surface-2: #1d2a40; --line: #2a3a55;
    --accent: #7c9dff; --accent-ink: #0d1420; --accent-soft: #1e2d52; --ok: #45c4a6; --ok-soft: #143a33; --bad: #ff8277; --bad-soft: #43201e;
    --flag: #f0c04a; --flag-soft: #3d3216; --grid: rgba(124, 157, 255, 0.05); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e4eaf4; --ink-2: #b4bfd2; --ink-3: #8794ab; --paper: #0d1420; --surface: #151f30; --surface-2: #1d2a40; --line: #2a3a55;
  --accent: #7c9dff; --accent-ink: #0d1420; --accent-soft: #1e2d52; --ok: #45c4a6; --ok-soft: #143a33; --bad: #ff8277; --bad-soft: #43201e;
  --flag: #f0c04a; --flag-soft: #3d3216; --grid: rgba(124, 157, 255, 0.05); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 16px/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 900px) { body { padding-bottom: 0; } }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.6rem, 3.6vw, 2.3rem); font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 800; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 0.875rem; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 700; }

/* Bilah atas */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 16px; padding: 10px 16px;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex-shrink: 0; }
.brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--ink); color: var(--paper); font: 800 1.2rem/1 var(--f-display); }
.brand-text { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; }
.brand-text b { color: var(--accent); font-weight: 800; }
.nav { display: none; gap: 2px; margin-left: auto; flex-wrap: wrap; }
.nav a { padding: 7px 11px; border-radius: 8px; text-decoration: none; color: var(--ink-2); font-weight: 700; font-size: 0.92rem; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
@media (min-width: 900px) { .nav { display: flex; } }
.theme-btn { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; cursor: pointer; }
@media (min-width: 900px) { .theme-btn { margin-left: 0; } }
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
}
.bottomnav a { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: var(--ink-3); font-size: 0.72rem; font-weight: 700; padding: 4px 0; border-radius: 8px; }
.bottomnav a span { font-size: 1.15rem; line-height: 1; }
.bottomnav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
@media (min-width: 900px) { .bottomnav { display: none; } }
body.exam-mode .bottomnav, body.exam-mode .nav { display: none; }

/* Wadah */
main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 40px; display: grid; gap: 20px; outline: none; }
.page-head { display: grid; gap: 6px; }
.page-head p { color: var(--ink-2); max-width: 65ch; }
.grid { display: grid; gap: 14px; }
.cols-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.cols-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.cols-4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card.raised { box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
.stack { display: grid; gap: 8px; }

/* Hero beranda */
.hero { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: stretch; }
@media (min-width: 800px) { .hero { grid-template-columns: 1.4fr 1fr; } }
.hero-main { background: var(--ink); color: var(--paper); border-radius: 14px; padding: 24px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.hero-main::after { content: ''; position: absolute; inset: auto -40px -60px auto; width: 220px; height: 220px; border-radius: 50%; border: 2px dashed color-mix(in srgb, var(--paper) 25%, transparent); }
.hero-main h1 { color: var(--paper); }
.hero-main p { color: color-mix(in srgb, var(--paper) 78%, transparent); max-width: 52ch; }
.hero-main .btn.primary { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.hero-main .btn.ghost { color: var(--paper); border-color: color-mix(in srgb, var(--paper) 40%, transparent); }
.stat { display: grid; gap: 2px; }
.stat .v { font: 700 1.6rem/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat .k { font-size: 0.8rem; color: var(--ink-3); }
.streak { display: flex; gap: 5px; flex-wrap: wrap; }
.streak i { width: 18px; height: 18px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.streak i.on { background: var(--ok); border-color: var(--ok); }
.streak i.today { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Tombol */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; cursor: pointer; text-decoration: none; min-height: 44px; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.flag[aria-pressed="true"] { background: var(--flag-soft); border-color: var(--flag); color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 10px; min-height: 34px; font-size: 0.875rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.icon-btn { border: 0; background: transparent; cursor: pointer; font-size: 1.1rem; width: 36px; height: 36px; border-radius: 8px; }
.icon-btn:hover { background: var(--surface-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.flag { background: var(--flag-soft); color: var(--flag); border-color: transparent; }
button.chip { cursor: pointer; }

/* Pilihan mode / preset */
.preset { display: grid; gap: 10px; text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 16px; color: var(--ink); }
.preset:hover { border-color: var(--accent); }
.preset .meta { display: flex; gap: 8px; flex-wrap: wrap; }
.preset .facts { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 4px 18px; }
.preset .facts b { font: 700 1.25rem/1 var(--f-mono); display: block; }
.preset .facts span { font-size: 0.75rem; color: var(--ink-3); }

/* Form */
.field { display: grid; gap: 4px; }
.field label { font-weight: 700; font-size: 0.9rem; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 11px; min-height: 42px; width: 100%; }
.field textarea { min-height: 120px; font-family: var(--f-mono); font-size: 0.8rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 8px 14px; cursor: pointer; font-weight: 700; color: var(--ink-2); min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
input[type="search"] { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 10px 12px; width: 100%; min-height: 44px; }

/* Daftar topik */
.topic-list { display: grid; gap: 8px; }
.topic { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; text-align: left; color: var(--ink); }
.topic:hover { border-color: var(--accent); }
.topic[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.topic .name { font-weight: 700; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; grid-column: 1 / -1; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.ok i { background: var(--ok); }
.bar.bad i { background: var(--bad); }
.bar.flag i { background: var(--flag); }

/* Ruang ujian */
.exam { display: grid; gap: 14px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 900px) { .exam { grid-template-columns: minmax(0, 1fr) 300px; } }
.exam-bar { position: sticky; top: calc(57px + env(safe-area-inset-top, 0px)); z-index: 10; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; background: var(--ink); color: var(--paper); border-radius: var(--r); padding: 10px 14px; }
.exam-bar .title { font-weight: 700; font-size: 0.95rem; min-width: 0; }
.timer { font: 700 1.25rem/1 var(--f-mono); font-variant-numeric: tabular-nums; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--paper) 14%, transparent); }
.timer.warn { background: var(--flag); color: #1b1300; }
.timer.crit { background: var(--bad); color: #fff; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 16px; min-width: 0; }
.qhead { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.qnum { font: 700 0.95rem/1 var(--f-mono); background: var(--ink); color: var(--paper); padding: 6px 10px; border-radius: 7px; }
.qtext { font-size: 1.06rem; line-height: 1.65; max-width: 72ch; overflow-wrap: anywhere; }
.qfig { width: 100%; max-width: 340px; height: auto; display: block; margin: 4px 0; color: var(--ink); }
.qfig .ax { stroke: var(--ink-2); stroke-width: 1.5; }
.qfig .ln { stroke: var(--accent); stroke-width: 3; fill: none; stroke-linejoin: round; }
.qfig .gd { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 4 4; }
.qfig text { fill: var(--ink-2); font: 12px var(--f-mono); }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; text-align: left; padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; color: var(--ink); line-height: 1.5; min-width: 0; }
.opt:hover { border-color: var(--ink-3); }
.opt .key { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); font: 700 0.9rem/1 var(--f-mono); }
.opt .txt { min-width: 0; overflow-wrap: anywhere; padding-top: 3px; }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-checked="true"] .key { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .key { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt .score { margin-left: 8px; }
.opt:disabled { cursor: default; }
.qnav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
.qnav .row { gap: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
@media (min-width: 900px) { .panel { position: sticky; top: calc(120px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 140px); overflow: auto; } }
.numgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 5px; }
.numgrid button { height: 36px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font: 700 0.8rem/1 var(--f-mono); color: var(--ink-2); }
.numgrid button.ans { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.numgrid button.flag { background: var(--flag); color: #1b1300; border-color: var(--flag); }
.numgrid button.cur { outline: 2.5px solid var(--accent); outline-offset: 1px; }
.numgrid button.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.numgrid button.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.78rem; color: var(--ink-3); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }
.sec-tag { font-size: 0.75rem; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; grid-column: 1 / -1; margin-top: 4px; }

/* Pembahasan */
.explain { border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; padding: 14px 16px; display: grid; gap: 8px; line-height: 1.65; overflow-wrap: anywhere; }
.explain.ok { border-color: var(--ok); background: var(--ok-soft); }
.explain.bad { border-color: var(--bad); background: var(--bad-soft); }
.explain h3 { font-size: 0.95rem; }
.formula-chips { display: flex; gap: 6px; flex-wrap: wrap; }

/* Hasil */
.score-big { font: 800 clamp(2.6rem, 8vw, 4rem)/1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.verdict { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; padding: 6px 12px; border-radius: 8px; }
.verdict.pass { background: var(--ok-soft); color: var(--ok); }
.verdict.fail { background: var(--bad-soft); color: var(--bad); }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
.review-item { border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; background: var(--surface); }
.review-item > summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.review-item > summary::-webkit-details-marker { display: none; }
.review-item > summary .qtext { font-size: 0.98rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.review-item[open] > summary .qtext { display: block; }
.dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 0.75rem/1 var(--f-mono); color: #fff; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.empty { background: var(--ink-3); }

/* Rumus */
.fcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; min-width: 0; }
.fcard .formula { font-size: 1.12rem; padding: 12px 14px; background: var(--surface-2); border-radius: 8px; overflow-x: auto; line-height: 2.1; }
.fcard dl { margin: 0; display: grid; gap: 6px; font-size: 0.93rem; }
.fcard dt { font-weight: 700; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
.fcard dd { margin: 0; color: var(--ink-2); }
details.chapter { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
details.chapter > summary { padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-weight: 700; align-items: center; }
details.chapter[open] > summary { border-bottom: 1px solid var(--line); }
details.chapter .inner { padding: 14px; display: grid; gap: 12px; }
.flash { min-height: 260px; display: grid; place-items: center; text-align: center; cursor: pointer; padding: 28px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.flash .front { font: 800 1.4rem/1.3 var(--f-display); }
.flash .formula { font-size: 1.4rem; line-height: 2.2; }

/* Rumus mini-TeX */
.tx { font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', Cambria, 'Times New Roman', serif; white-space: nowrap; font-size: 1.05em; }
.tx i { font-style: italic; }
.tx sub, .tx sup { font-size: 0.72em; }
.tx-op { padding: 0 0.22em; }
.tx-frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 0.12em; line-height: 1.15; }
.tx-num { border-bottom: 1px solid currentColor; padding: 0 0.15em; }
.tx-den { padding: 0 0.15em; }
.tx-sqrt { display: inline-flex; align-items: stretch; }
.tx-rad { font-size: 1.1em; padding-right: 0.05em; }
.tx-under { border-top: 1px solid currentColor; padding: 0 0.12em; }
.tx-vec { position: relative; display: inline-block; }
.tx-vec::before { content: '→'; position: absolute; top: -0.85em; left: 0; right: 0; text-align: center; font-size: 0.7em; font-style: normal; }
.tx-bar { text-decoration: overline; }
.tx-text, .tx-fn { font-style: normal; font-family: var(--f-body); font-size: 0.9em; }
.tx-root { font-size: 0.6em; margin-right: -0.3em; vertical-align: 0.9em; }

.chart .gridline { stroke: var(--line); stroke-width: 1; }
.chart .line { stroke: var(--accent); stroke-width: 2.5; fill: none; }
.chart .area { fill: var(--accent-soft); }

.chart .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .pt.last { fill: var(--accent); }
.chart text { fill: var(--ink-3); font: 11px var(--f-mono); }

/* Modal & toast */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 26, 0.55); display: grid; place-items: center; padding: 16px; }
.modal-card { background: var(--surface); color: var(--ink); border-radius: 14px; width: min(560px, 100%); max-height: 90vh; overflow: auto; box-shadow: var(--shadow); }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.modal-body { padding: 16px; display: grid; gap: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-weight: 700; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
@media (min-width: 900px) { .toast { bottom: 24px; } }
.empty { text-align: center; padding: 28px; color: var(--ink-3); border: 1.5px dashed var(--line); border-radius: var(--r); }

  .qcard, .explain { animation: rise 0.18s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}

<script>
/* Utilitas bersama: RNG berbibit, format angka Indonesia, render rumus mini-TeX. */
(function (root) {
  'use strict';
  const SKB = (root.SKB = root.SKB || {});

  // ---------- RNG deterministik ----------
  function hashStr(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeRng(seed) {
    const r = mulberry32(typeof seed === 'number' ? seed : hashStr(String(seed)));
    const rng = () => r();
    rng.int = (a, b) => a + Math.floor(r() * (b - a + 1));
    rng.pick = (arr) => arr[Math.floor(r() * arr.length)];
    rng.step = (a, b, s) => a + s * Math.floor(r() * (Math.round((b - a) / s) + 1));
    rng.shuffle = (arr) => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(r() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };
    rng.sample = (arr, n) => rng.shuffle(arr).slice(0, n);
    rng.chance = (p) => r() < p;
    return rng;
  }

  // ---------- Format angka (desimal koma) ----------
  const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
  function supNum(n) { return String(n).split('').map((c) => SUP[c] || c).join(''); }
  function round(x, d) { const p = Math.pow(10, d); return Math.round(x * p) / p; }
  function trimZeros(s) { return s.indexOf('.') >= 0 ? s.replace(/0+$/, '').replace(/\.$/, '') : s; }
  function groupThousands(intPart) { return intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  /** fmt(x, sig): angka dengan maksimal `sig` angka penting, koma desimal, notasi ilmiah bila perlu. */
  function fmt(x, sig) {
    sig = sig || 3;
    if (!isFinite(x)) return String(x);
    if (x === 0) return '0';
    const ax = Math.abs(x);
    if (ax >= 1e6 || ax < 1e-3) {
      let e = Math.floor(Math.log10(ax));
      let m = x / Math.pow(10, e);
      m = Number(m.toPrecision(sig));
      if (Math.abs(m) >= 10) { m /= 10; e += 1; }
      const ms = trimZeros(String(m)).replace('.', ',');
      return (ms === '1' ? '' : ms === '-1' ? '-' : ms + ' × ') + '10' + supNum(e);
    }
    let s;
    if (Number.isInteger(x) && ax < 1e6) s = String(x);
    else s = trimZeros(Number(x.toPrecision(sig)).toFixed(Math.max(0, sig - 1 - Math.floor(Math.log10(ax)))));
    const neg = s[0] === '-';
    if (neg) s = s.slice(1);
    const [ip, dp] = s.split('.');
    const out = (ip.length > 4 ? groupThousands(ip) : ip) + (dp ? ',' + dp : '');
    return (neg ? '−' : '') + out;
  }
  function pct(x, d) { return fmt(round(x, d == null ? 1 : d), 4) + '%'; }

  // ---------- Mini-TeX → HTML ----------
  const GREEK = {
    alpha: 'α', beta: 'β', gamma: 'γ', Gamma: 'Γ', delta: 'δ', Delta: 'Δ', epsilon: 'ε', varepsilon: 'ε',
    eta: 'η', theta: 'θ', Theta: 'Θ', lambda: 'λ', Lambda: 'Λ', mu: 'μ', nu: 'ν', pi: 'π', rho: 'ρ',
    sigma: 'σ', Sigma: 'Σ', tau: 'τ', phi: 'φ', Phi: 'Φ', omega: 'ω', Omega: 'Ω', chi: 'χ', psi: 'ψ',
    cdot: '·', times: '×', div: '÷', approx: '≈', to: '→', rightarrow: '→', Rightarrow: '⇒', iff: '⇔',
    infty: '∞', pm: '±', propto: '∝', ge: '≥', le: '≤', geq: '≥', leq: '≤', neq: '≠', ne: '≠',
    degree: '°', circ: '°', sum: 'Σ', int: '∫', partial: '∂', ell: 'ℓ', hbar: 'ħ', quad: ' ',
    ',': ' ', ';': ' ', '%': '%', minus: '−', parallel: '∥', perp: '⊥', angle: '∠', sim: '∼',
    lt: '&lt;', gt: '&gt;', dots: '…', ldots: '…', cos: 'cos', sin: 'sin', tan: 'tan', log: 'log', ln: 'ln',
  };
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function texToHtml(src) {
    let i = 0;
    function group() {
      // membaca {…} atau satu token
      while (src[i] === ' ') i++;
      if (src[i] === '{') {
        i++;
        const out = seq('}');
        i++; // '}'
        return out;
      }
      return atom();
    }
    function atom() {
      const c = src[i];
      if (c === '\\') {
        i++;
        let m = /^[A-Za-z]+/.exec(src.slice(i));
        let name;
        if (m) { name = m[0]; i += name.length; } else { name = src[i]; i++; }
        switch (name) {
          case 'frac': case 'tfrac': case 'dfrac': {
            const a = group(), b = group();
            return '<span class="tx-frac"><span class="tx-num">' + a + '</span><span class="tx-den">' + b + '</span></span>';
          }
          case 'sqrt': {
            let idx = '';
            if (src[i] === '[') { const j = src.indexOf(']', i); idx = '<sup class="tx-root">' + esc(src.slice(i + 1, j)) + '</sup>'; i = j + 1; }
            return idx + '<span class="tx-sqrt"><span class="tx-rad">√</span><span class="tx-under">' + group() + '</span></span>';
          }
          case 'vec': return '<span class="tx-vec">' + group() + '</span>';
          case 'bar': case 'overline': return '<span class="tx-bar">' + group() + '</span>';
          case 'text': case 'mathrm': case 'rm': return '<span class="tx-text">' + group() + '</span>';
          case 'left': case 'right': case 'big': case 'Big': return '';
          default:
            if (GREEK[name] != null) {
              const fn = /^(cos|sin|tan|log|ln)$/.test(name);
              return fn ? '<span class="tx-fn">' + GREEK[name] + '</span>' : GREEK[name];
            }
            return esc('\\' + name);
        }
      }
      i++;
      if (/[A-Za-z]/.test(c)) return '<i>' + c + '</i>';
      if (c === '*') return '·';
      if (c === '-') return '−';
      if (c === '=' || c === '+' || c === '−') return '<span class="tx-op">' + c + '</span>';
      return esc(c);
    }
    function seq(end) {
      let out = '';
      while (i < src.length && src[i] !== end) {
        const c = src[i];
        if (c === '^' || c === '_') {
          i++;
          const g = group();
          out += c === '^' ? '<sup>' + g + '</sup>' : '<sub>' + g + '</sub>';
        } else if (c === '=' ) { i++; out += '<span class="tx-op">=</span>'; }
        else if (c === '+') { i++; out += '<span class="tx-op">+</span>'; }
        else if (c === ' ') { i++; out += ' '; }
        else out += atom();
      }
      return out;
    }
    try { return seq(undefined); } catch (e) { return esc(src); }
  }
  /** Mengganti $…$ dalam teks menjadi rumus ter-render. Teks di luar $ dibiarkan (boleh HTML). */
  function rich(s) {
    if (s == null) return '';
    return String(s).replace(/\$([^$]+)\$/g, (_, t) => '<span class="tx">' + texToHtml(t) + '</span>');
  }

  SKB.util = { hashStr, makeRng, fmt, pct, round, supNum, texToHtml, rich, esc };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  function numericOptions(r, ans, wrong, unit, sig) {
    sig = sig || 3;
    const u = unit ? ' ' + unit : '';
    const f = (v) => U.fmt(v, sig) + u;
    const correct = f(ans);
    const seen = new Set([correct]);
    const opts = [];
    const tryAdd = (v) => {
      if (opts.length >= 4 || typeof v !== 'number' || !isFinite(v)) return;
      if (ans > 0 && v <= 0) return;
      const s = f(v);
      if (seen.has(s)) return;
      seen.add(s); opts.push(s);
    };
    (wrong || []).forEach(tryAdd);
    for (let i = 0; opts.length < 4 && i < FILL.length; i++) tryAdd(ans * FILL[(i + r.int(0, FILL.length - 1)) % FILL.length]);

    for (let i = 1; opts.length < 4 && i < 20; i++) { tryAdd(ans + base * i * 0.5); tryAdd(ans - base * i * 0.5); }

    return { options: all, answer: all.indexOf(correct) };
  }
  function textOptions(r, correct, wrong) {
    const uniq = [];
    wrong.forEach((w) => { if (w !== correct && uniq.indexOf(w) < 0) uniq.push(w); });
    const picked = r.sample(uniq, 4);
    if (picked.length < 4) throw new Error('opsi pengecoh kurang: ' + correct);
    const all = r.shuffle([correct].concat(picked));
    return { options: all, answer: all.indexOf(correct) };
  }
  /** Untuk opsi yang urutannya bermakna (mis. A–E urut angka) gunakan fixed: true. */
  function finalize(t, k, r, out) {
    let o;
    if (out.options) o = { options: out.options, answer: out.answer, scores: out.scores };
    else if (typeof out.ans === 'number') o = numericOptions(r, out.ans, out.wrong, out.unit, out.sig);
    else o = textOptions(r, out.correct, out.wrong);
    return {
      id: t.id + '-' + k,
      tpl: t.id,
      sec: t.sec,
      topic: out.topic || t.topic,
      level: out.level || t.level,
      formulas: out.formulas || t.formulas,
      q: out.q,
      options: o.options,
      answer: o.answer,
      scores: o.scores || null,
      explain: out.explain || '',
      svg: out.svg || '',
    };
  }

  let BANK = null;
  function build() {
    if (BANK) return BANK;
    const list = [];
    const byId = {};
    templates.forEach((t) => {
      const seenQ = new Set();
      let made = 0;
      for (let k = 0; made < t.count && k < t.count * 4; k++) {
        const r = U.makeRng(t.id + ':' + k);
        let out;
        try { out = t.gen(r, k); } catch (e) { if (root.SKB_DEBUG) throw e; continue; }
        if (!out) continue;
        const key = out.key || out.q;
        if (seenQ.has(key)) continue;
        seenQ.add(key);
        let item;
        try { item = finalize(t, made, r, out); } catch (e) { if (root.SKB_DEBUG) console.warn(t.id, e.message); continue; }
        list.push(item);
        byId[item.id] = item;
        made++;
      }
      t.made = made;
    });
    BANK = { list, byId, templates };
    return BANK;
  }

  SKB.bank = { SECTIONS, PED_TOPICS, add, build, templates, numericOptions, textOptions };
})(typeof window !== 'undefined' ? window : globalThis);
